<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Editar Produto - SENAI</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <nav class="navbar">
        <div class="navbar-brand">MEU ALMOXARIFADO <span>SENAI</span></div>
        <div class="nav-links">
            <a href="{{ url_for('estoque') }}">Voltar ao Estoque</a>
        </div>
    </nav>

    <div class="container" style="max-width: 700px;">
        <div class="card" style="margin-bottom: 1.5rem;">
            <h2>Dar Baixa no Estoque</h2>
            <p><strong>Produto:</strong> {{ produto.nome }} | <strong>Atual:</strong> {{ produto.quantidade }} unidades</p>
            <br>
            <form action="{{ url_for('editar_produto', id=produto.id) }}" method="POST" style="display: flex; gap: 10px;">
                <input type="hidden" name="acao" value="dar_baixa">
                <input type="number" name="qtd_baixa" class="form-control" min="1" max="{{ produto.quantidade }}" placeholder="Quantidade para retirar" required>
                <button type="submit" class="btn btn-primary">Retirar do Estoque</button>
            </form>
        </div>

        <div class="card">
            <h2>Editar Informações do Produto</h2>
            <br>
            <form action="{{ url_for('editar_produto', id=produto.id) }}" method="POST">
                <input type="hidden" name="acao" value="atualizar">
                <div class="form-group">
                    <label>Nome do Produto</label>
                    <input type="text" name="nome" class="form-control" value="{{ produto.nome }}" required>
                </div>
                <div class="form-group">
                    <label>URL da Imagem</label>
                    <input type="text" name="imagem_url" class="form-control" value="{{ produto.imagem_url }}">
                </div>
                <div class="form-group">
                    <label>Descrição</label>
                    <textarea name="descricao" class="form-control" rows="3">{{ produto.descricao }}</textarea>
                </div>
                <div class="form-group">
                    <label>Quantidade em Estoque</label>
                    <input type="number" name="quantidade" class="form-control" min="0" value="{{ produto.quantidade }}" required>
                </div>
                <button type="submit" class="btn btn-secondary">Atualizar Produto</button>
            </form>

            <hr style="margin: 2rem 0; border: 0; border-top: 1px solid var(--border-color);">

            <form action="{{ url_for('editar_produto', id=produto.id) }}" method="POST" onsubmit="return confirm('Tem certeza de que deseja EXCLUIR este produto permanentemente?');">
                <input type="hidden" name="acao" value="excluir">
                <button type="submit" class="btn btn-danger">Excluir Produto Permanentemente</button>
            </form>
        </div>
    </div>
</body>
</html>
