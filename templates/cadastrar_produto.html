<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Novo Produto - SENAI</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <nav class="navbar">
        <div class="navbar-brand">MEU ALMOXARIFADO <span>SENAI</span></div>
        <div class="nav-links">
            <a href="{{ url_for('estoque') }}">Voltar ao Estoque</a>
        </div>
    </nav>

    <div class="container" style="max-width: 600px;">
        <div class="card">
            <h2>Cadastrar Novo Produto</h2>
            <br>
            <form action="{{ url_for('cadastrar_produto') }}" method="POST">
                <div class="form-group">
                    <label>Nome do Produto</label>
                    <input type="text" name="nome" class="form-control" required>
                </div>
                <div class="form-group">
                    <label>URL da Imagem</label>
                    <input type="url" name="imagem_url" class="form-control" placeholder="https://exemplo.com/imagem.png">
                </div>
                <div class="form-group">
                    <label>Descrição</label>
                    <textarea name="descricao" class="form-control" rows="3"></textarea>
                </div>
                <div class="form-group">
                    <label>Quantidade Inicial</label>
                    <input type="number" name="quantidade" class="form-control" min="0" value="1" required>
                </div>
                <button type="submit" class="btn btn-primary" style="width: 100%;">Salvar Produto</button>
            </form>
        </div>
    </div>
</body>
</html>
